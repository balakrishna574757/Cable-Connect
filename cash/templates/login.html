
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CableConnect - Login</title>

    <link rel="stylesheet" href="{% static 'login.css' %}">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- Logo Section -->
            <div class="logo">

                <div class="logo-icon">
                    CC
                </div>

                <h1>CableConnect</h1>

                <p>Cable Management System</p>

            </div>


            <!-- Login Heading -->
            <div class="heading">

                <h2>Welcome Back!</h2>

                <p>Please login to your account</p>

            </div>


            <!-- Login Form -->
            <form method="post">

                {% csrf_token %}

                <!-- Username -->
                <div class="form-group">

                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <!-- Login Button -->
                <button type="submit">
                    Login
                </button>

            </form>


            <!-- Footer -->
            <div class="footer">

                <p>© 2026 CableConnect. All Rights Reserved.</p>

            </div>

        </div>

    </div>

</body>

</html>
