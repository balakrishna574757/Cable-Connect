
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Package</title>

    <link rel="stylesheet" href="{% static 'sidebar.css' %}">
    <link rel="stylesheet" href="{% static 'package.css' %}">

    <style>

        .page-content {
            margin-left: 290px;
            padding: 40px;
            min-height: 100vh;
            background: #f1f5f9;
        }

        .delete-container {
            max-width: 550px;
            margin: 60px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
        }

        .delete-container h2 {
            color: #dc2626;
            margin-bottom: 20px;
        }

        .delete-container p {
            color: #475569;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 14px;
        }

        .confirm-delete {
            background: #dc2626;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .confirm-delete:hover {
            background: #b91c1c;
        }

        .back-btn {
            display: inline-block;
            background: #64748b;
            color: white;
            padding: 12px 22px;
            border-radius: 7px;
            text-decoration: none;
            margin-left: 8px;
        }

        @media(max-width: 768px) {
            .page-content {
                margin-left: 0;
                padding: 20px;
            }

            .delete-container {
                margin: 30px auto;
                padding: 22px;
            }
        }

    </style>

</head>

<body>

    {% include 'sidebar.html' %}

    <div class="page-content">

        <div class="delete-container">

            <h2>Delete Package</h2>

            {% if error_message %}

                <div class="error-message">
                    <strong>Cannot Delete Package!</strong>
                    <p>{{ error_message }}</p>
                </div>

                <a href="{% url 'package' %}" class="back-btn">
                    Back to Packages
                </a>

            {% else %}

                <p>
                    Are you sure you want to delete
                    <strong>{{ package.package_name }}</strong>?
                </p>

                <form method="POST">
                    {% csrf_token %}

                    <button type="submit" class="confirm-delete">
                        Yes, Delete
                    </button>

                    <a href="{% url 'package' %}" class="back-btn">
                        Cancel
                    </a>

                </form>

            {% endif %}

        </div>

    </div>

</body>
</html>
